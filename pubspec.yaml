name: southsea_cinema
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev
publish_to: 'none'

# Application version
version: 1.0.0+1

# Dart SDK requirements
environment:
  sdk: '>=3.0.0'

# Application dependencies
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: '>=1.0.8'

# Development and testing dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: '>=4.0.0'

# Flutter configuration
flutter:

  # Enable Material Design icons
  uses-material-design: true

  # Register image and JSON assets
  assets:
    - assets/images/
    - assets/data/
